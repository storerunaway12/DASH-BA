<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F1115" />
<title>Painel do Investidor</title>
<meta name="description" content="Acompanhamento em tempo real dos aportes e rendimentos." />

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#0F1115; --gold:#D4AF37; --green:#16C784; --red:#F6465D;
    --txt:#EDEFF3; --muted:#8B919C; --line:rgba(255,255,255,.07); --glass:rgba(255,255,255,.032);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt); -webkit-font-smoothing:antialiased;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  button{font-family:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:28px 16px 40px;position:relative}
  @media(min-width:640px){.wrap{padding:40px 24px 56px}}
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px -30px rgba(0,0,0,.9)}
  .atmos{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(60% 40% at 12% -5%,#D4AF3712,transparent 65%),radial-gradient(50% 35% at 95% 0%,#16C7840e,transparent 60%)}
  .eyebrow{color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  .num{font-variant-numeric:tabular-nums}
  .row{display:flex}.mid{align-items:center}.wrapf{flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:1fr}
  @media(min-width:640px){.g4{grid-template-columns:1fr 1fr}}
  @media(min-width:1100px){.g4{grid-template-columns:repeat(4,1fr)}}
  .g3{grid-template-columns:1fr}
  @media(min-width:640px){.g3{grid-template-columns:repeat(3,1fr)}}
  input,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);padding:10px 12px;font-size:14px;outline:none;font-variant-numeric:tabular-nums;font-family:inherit}
  input::placeholder{color:#5c626c}
  input:focus{border-color:#D4AF3766;box-shadow:0 0 0 3px #D4AF371a}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.65)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:0 12px 12px;white-space:nowrap}
  td{padding:13px 12px;font-size:14px;border-top:1px solid var(--line)}
  .tabbtn{display:flex;align-items:center;gap:8px;padding:10px 14px;white-space:nowrap;background:none;
    border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-size:13.5px;color:var(--muted);transition:.2s}
  .tabbtn.on{color:var(--txt);font-weight:650;border-bottom-color:var(--gold)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:12px;
    font-size:13px;font-weight:600;cursor:pointer;transition:transform .2s,filter .2s;
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt)}
  .btn:hover{transform:translateY(-1px)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#12140f}
  .btn.danger{background:rgba(246,70,93,.10);border-color:rgba(246,70,93,.25);color:var(--red)}
  .pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .icobox{display:grid;place-items:center;border-radius:10px;flex-shrink:0}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 #16C78466}50%{opacity:.55;box-shadow:0 0 0 5px #16C78400}}
  .rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--green);animation:pulse 1.8s ease-in-out infinite}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
  .scrollx{overflow-x:auto}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:99;color:var(--muted);font-size:13px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot">Carregando o painel…</div>
<div class="atmos"></div>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ══════════════════════════════════════════════════════════════
   CONFIGURAÇÃO — só mexa aqui se for usar o Supabase.
   Deixando em branco, o painel salva os dados no próprio navegador.
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: "",
  CARTEIRA_ID: "00000000-0000-0000-0000-000000000001",
};

const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ─── cores ─── */
const GOLD="#D4AF37", GREEN="#16C784", RED="#F6465D", BG="#0F1115",
      TXT="#EDEFF3", MUTED="#8B919C", LINE="rgba(255,255,255,.07)";

/* ─── datas e dinheiro ─── */
const MS_DAY=86400000, AVG_MONTH=30.436875;
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES_CURTO=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const brl=(v,d=2)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:d,maximumFractionDigits:d}).format(v||0);
const curto=(v)=>{const a=Math.abs(v||0);
  if(a>=1e6) return "R$ "+(v/1e6).toFixed(1).replace(".",",")+"M";
  if(a>=1e3) return "R$ "+Math.round(v/1e3)+"k";
  return "R$ "+Math.round(v||0);};
const pct=(v,d=2)=>(v>=0?"+":"")+(v*100).toFixed(d).replace(".",",")+"%";
const toDate=(s)=>new Date(s+"T12:00:00");
const toIso=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDate=(s)=>toDate(s).toLocaleDateString("pt-BR");

/* ─── juros compostos por fração de mês ─── */
const meses=(a,b)=>(b-a)/(AVG_MONTH*MS_DAY);
const cresce=(r,m)=>Math.pow(1+r,m);
const sig=(e)=>e.type==="retirada"?-Math.abs(e.amount):Math.abs(e.amount);
const valorEm=(es,r,t)=>es.reduce((s,e)=>{const d=toDate(e.date).getTime();return d>t?s:s+sig(e)*cresce(r,meses(d,t));},0);
const capitalEm=(es,t)=>es.reduce((s,e)=>toDate(e.date).getTime()>t?s:s+sig(e),0);

/* ─── onde os dados ficam guardados ─── */
const CHAVE="painel-investidor:v1";
const temSupabase = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
const sb = temSupabase ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const dados = {
  async carregar(){
    if(sb){
      try{
        const {data,error}=await sb.from("carteira").select("dados").eq("id",CONFIG.CARTEIRA_ID).maybeSingle();
        if(error) throw error;
        if(data && data.dados && data.dados.entries){ localStorage.setItem(CHAVE,JSON.stringify(data.dados)); return data.dados; }
      }catch(e){ console.warn("Supabase indisponível, usando dados do navegador.",e); }
    }
    try{ const r=localStorage.getItem(CHAVE); return r?JSON.parse(r):null; }catch(e){ return null; }
  },
  async salvar(estado){
    try{ localStorage.setItem(CHAVE,JSON.stringify(estado)); }catch(e){}
    if(!sb) return;
    try{
      const ses=await sb.auth.getSession();
      if(!ses.data.session) return; // visitante: pode ver, não pode alterar
      const {error}=await sb.from("carteira").upsert({id:CONFIG.CARTEIRA_ID,dados:estado,atualizado_em:new Date().toISOString()});
      if(error) throw error;
    }catch(e){ console.warn("Não deu para salvar no Supabase. Ficou salvo no navegador.",e); }
  }
};

const INICIAL={
  settings:{rate:.10,meta:200000,nome:"Investimento no blog"},
  entries:[
    {id:"s1",date:"2026-01-05",type:"aporte",amount:50000,description:"Investimento inicial"},
    {id:"s2",date:"2026-03-10",type:"aporte",amount:15000,description:"Aporte adicional"},
    {id:"s3",date:"2026-05-20",type:"aporte",amount:10000,description:"Aporte adicional"},
  ]
};

/* ══════════════ ÍCONES ══════════════ */
const P={
  grid:"M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
  wallet:"M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4z",
  receipt:"M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1zM16 8h-6M16 12h-6",
  target:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
  cog:"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6",
  plus:"M12 5v14M5 12h14",
  trash:"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6",
  down:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
  up:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
  x:"M18 6 6 18M6 6l12 12",
  aUp:"M7 17 17 7M7 7h10v10",
  aDown:"M7 7l10 10M17 7v10H7",
  cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  trend:"M22 7l-8.5 8.5-5-5L2 17M16 7h6v6",
  right:"M9 18l6-6-6-6",
  spark:"M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z",
  coin:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v10M15 9.5c0-1.1-1.3-2-3-2s-3 .9-3 2 1.3 2 3 2 3 .9 3 2-1.3 2-3 2-3-.9-3-2",
  bank:"M3 21h18M4 10h16M5 10V6l7-4 7 4v4M7 10v11M12 10v11M17 10v11",
  pct:"M19 5 5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z",
  pulse:"M22 12h-4l-3 9L9 3l-3 9H2",
};
function I({n,s=16,c=MUTED,w=2}){
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={w} strokeLinecap="round" strokeLinejoin="round"><path d={P[n]}/></svg>;
}

/* ══════════════ MEDIDOR DE LARGURA ══════════════ */
function useLargura(){
  const ref=useRef(null); const [w,setW]=useState(760);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const medir=()=>setW(el.clientWidth||760);
    medir();
    let ro; if(window.ResizeObserver){ ro=new ResizeObserver(medir); ro.observe(el); }
    else window.addEventListener("resize",medir);
    return()=>{ ro?ro.disconnect():window.removeEventListener("resize",medir); };
  },[]);
  return [ref,w];
}
const tetoBonito=(v)=>{ if(v<=0) return 100;
  const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; };

/* ══════════════ GRÁFICO DE LINHA ══════════════ */
function GraficoLinha({dados:ds,altura=300}){
  const [ref,W]=useLargura();
  const [hi,setHi]=useState(null);
  if(!ds.length) return <div ref={ref} style={{height:altura,display:"grid",placeItems:"center",color:MUTED,fontSize:13}}>Sem dados para exibir.</div>;

  const H=altura, pL=64,pR=14,pT=16,pB=28;
  const iw=Math.max(10,W-pL-pR), ih=H-pT-pB;
  const maxV=tetoBonito(Math.max(...ds.map(d=>Math.max(d.patrimonio||0,d.projecao||0,d.aportado||0))));
  const X=(i)=>pL+(i/(ds.length-1))*iw;
  const Y=(v)=>pT+(1-(v||0)/maxV)*ih;
  const linha=(k)=>{ let d="",aberto=false;
    ds.forEach((p,i)=>{ const v=p[k]; if(v==null){aberto=false;return;} d+=(aberto?" L":" M")+X(i)+","+Y(v); aberto=true; });
    return d.trim(); };
  const area=()=>{ const pts=ds.map((p,i)=>p.patrimonio!=null?[X(i),Y(p.patrimonio)]:null).filter(Boolean);
    if(!pts.length) return "";
    return "M"+pts[0][0]+","+(pT+ih)+" L"+pts.map(p=>p[0]+","+p[1]).join(" L")+" L"+pts[pts.length-1][0]+","+(pT+ih)+" Z"; };
  const ticks=[0,.25,.5,.75,1].map(f=>maxV*f);
  const rotulosX=[0,Math.floor(ds.length*.25),Math.floor(ds.length*.5),Math.floor(ds.length*.75),ds.length-1];

  const mover=(e)=>{ const r=e.currentTarget.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const i=Math.round(((x-pL)/iw)*(ds.length-1));
    setHi(i>=0&&i<ds.length?i:null); };

  const p=hi!=null?ds[hi]:null;
  return (
    <div ref={ref} style={{position:"relative"}}>
      <svg width="100%" height={H} onMouseMove={mover} onMouseLeave={()=>setHi(null)} onTouchMove={mover} style={{display:"block",touchAction:"pan-y"}}>
        <defs>
          <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={GOLD} stopOpacity=".34"/><stop offset="100%" stopColor={GOLD} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {ticks.map((t,i)=>(<g key={i}>
          <line x1={pL} x2={W-pR} y1={Y(t)} y2={Y(t)} stroke={LINE}/>
          <text x={pL-10} y={Y(t)+4} textAnchor="end" fill={MUTED} fontSize="11">{curto(t)}</text>
        </g>))}
        {rotulosX.map((i,k)=>(<text key={k} x={X(i)} y={H-8} textAnchor={k===0?"start":k===4?"end":"middle"} fill={MUTED} fontSize="11">
          {new Date(ds[i].t).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}</text>))}
        <path d={area()} fill="url(#ga)"/>
        <path d={linha("aportado")} fill="none" stroke={MUTED} strokeWidth="1.4" strokeDasharray="2 4"/>
        <path d={linha("patrimonio")} fill="none" stroke={GOLD} strokeWidth="2.4"/>
        <path d={linha("projecao")} fill="none" stroke={GREEN} strokeWidth="2" strokeDasharray="5 5"/>
        {p&&(<g>
          <line x1={X(hi)} x2={X(hi)} y1={pT} y2={pT+ih} stroke={GOLD} strokeOpacity=".35"/>
          <circle cx={X(hi)} cy={Y(p.patrimonio!=null?p.patrimonio:p.projecao)} r="4.5" fill={p.patrimonio!=null?GOLD:GREEN} stroke={BG} strokeWidth="2"/>
        </g>)}
      </svg>
      {p&&(<div className="glass" style={{position:"absolute",top:6,left:Math.min(Math.max(X(hi)-70,pL),W-160),padding:"9px 12px",borderRadius:12,pointerEvents:"none",minWidth:150}}>
        <div style={{color:MUTED,fontSize:11,marginBottom:3}}>{new Date(p.t).toLocaleDateString("pt-BR")}</div>
        <div className="num" style={{fontSize:13,color:p.patrimonio!=null?GOLD:GREEN,fontWeight:650}}>{brl(p.patrimonio!=null?p.patrimonio:p.projecao,0)}</div>
        <div className="num" style={{fontSize:11.5,color:MUTED}}>Capital: {brl(p.aportado,0)}</div>
      </div>)}
    </div>
  );
}

/* ══════════════ GRÁFICO DE BARRAS ══════════════ */
function GraficoBarras({dados:ds,altura=270}){
  const [ref,W]=useLargura();
  const [hi,setHi]=useState(null);
  if(!ds.length) return <div ref={ref} style={{height:altura,display:"grid",placeItems:"center",color:MUTED,fontSize:13}}>Sem meses fechados ainda.</div>;

  const H=altura,pL=64,pR=14,pT=16,pB=30;
  const iw=Math.max(10,W-pL-pR), ih=H-pT-pB;
  const maxV=tetoBonito(Math.max(...ds.map(d=>d.lucro),1));
  const passo=iw/ds.length, larg=Math.min(54,passo*.58);
  const Y=(v)=>pT+(1-v/maxV)*ih;
  const barra=(x,y,w,h,r)=>{ r=Math.min(r,h,w/2);
    return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`; };
  const ticks=[0,.25,.5,.75,1].map(f=>maxV*f);
  const curtoNome=ds.length>7;

  return (
    <div ref={ref} style={{position:"relative"}}>
      <svg width="100%" height={H} style={{display:"block"}} onMouseLeave={()=>setHi(null)}>
        <defs>
          <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={GREEN} stopOpacity=".95"/><stop offset="100%" stopColor={GREEN} stopOpacity=".22"/></linearGradient>
          <linearGradient id="gbp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={GOLD} stopOpacity=".85"/><stop offset="100%" stopColor={GOLD} stopOpacity=".18"/></linearGradient>
        </defs>
        {ticks.map((t,i)=>(<g key={i}>
          <line x1={pL} x2={W-pR} y1={Y(t)} y2={Y(t)} stroke={LINE}/>
          <text x={pL-10} y={Y(t)+4} textAnchor="end" fill={MUTED} fontSize="11">{curto(t)}</text>
        </g>))}
        {ds.map((d,i)=>{
          const x=pL+passo*i+(passo-larg)/2, y=Y(d.lucro), h=Math.max(2,pT+ih-y);
          return (<g key={d.key} onMouseEnter={()=>setHi(i)}>
            <rect x={pL+passo*i} y={pT} width={passo} height={ih} fill={hi===i?"rgba(255,255,255,.03)":"transparent"}/>
            <path d={barra(x,y,larg,h,7)} fill={d.parcial?"url(#gbp)":"url(#gb)"}/>
            <text x={pL+passo*i+passo/2} y={H-9} textAnchor="middle" fill={MUTED} fontSize="11">{curtoNome?d.mesCurto:d.mes}</text>
          </g>);
        })}
      </svg>
      {hi!=null&&(<div className="glass" style={{position:"absolute",top:6,left:Math.min(Math.max(pL+passo*hi-40,pL),W-170),padding:"9px 12px",borderRadius:12,pointerEvents:"none",minWidth:150}}>
        <div style={{color:MUTED,fontSize:11,marginBottom:3}}>{ds[hi].mes} {ds[hi].ano}{ds[hi].parcial?" · em andamento":""}</div>
        <div className="num" style={{fontSize:13,color:ds[hi].parcial?GOLD:GREEN,fontWeight:650}}>{brl(ds[hi].lucro)}</div>
      </div>)}
    </div>
  );
}

/* ══════════════ PEÇAS DE INTERFACE ══════════════ */
const Eyebrow=({children})=><span className="eyebrow">{children}</span>;

function Secao({titulo,dica,direita,children}){
  return (<section style={{marginBottom:24}}>
    <div className="row mid wrapf" style={{justifyContent:"space-between",gap:12,marginBottom:12,padding:"0 4px"}}>
      <div>
        <h2 style={{fontSize:17,fontWeight:600,letterSpacing:"-.01em",margin:0}}>{titulo}</h2>
        {dica&&<p style={{color:MUTED,fontSize:12.5,margin:"3px 0 0"}}>{dica}</p>}
      </div>{direita}
    </div>
    <div className="glass" style={{padding:18}}>{children}</div>
  </section>);
}

function Card({ico,emoji,rotulo,valor,sub,cor=GOLD,atraso=0,vivo}){
  return (<div className="glass rise" style={{padding:18,animationDelay:atraso+"ms",position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,pointerEvents:"none",background:`radial-gradient(120% 100% at 0% 0%, ${cor}14, transparent 60%)`}}/>
    <div className="row mid" style={{justifyContent:"space-between",marginBottom:12,position:"relative"}}>
      <Eyebrow>{emoji?emoji+" ":""}{rotulo}</Eyebrow>
      <span className="icobox" style={{width:30,height:30,background:cor+"1A",border:"1px solid "+cor+"33"}}><I n={ico} c={cor} s={15}/></span>
    </div>
    <div className="row" style={{alignItems:"baseline",gap:8,position:"relative"}}>
      <span className="num" style={{fontSize:25,fontWeight:650,letterSpacing:"-.02em"}}>{valor}</span>
      {vivo&&<span className="dot" style={{marginBottom:4}}/>}
    </div>
    {sub&&<div style={{color:MUTED,fontSize:12.5,marginTop:6,position:"relative"}}>{sub}</div>}
  </div>);
}

function Campo({rotulo,children}){
  return (<label style={{display:"block"}}>
    <span style={{color:MUTED,fontSize:11.5,fontWeight:600,letterSpacing:".06em",textTransform:"uppercase"}}>{rotulo}</span>
    <div style={{marginTop:6}}>{children}</div>
  </label>);
}

function Tabela({linhas,aoExcluir}){
  if(!linhas.length) return <div style={{color:MUTED,fontSize:13.5,padding:"28px 0",textAlign:"center"}}>Nada registrado por aqui ainda.</div>;
  const sel={aporte:{t:"Aporte",c:GOLD},retirada:{t:"Retirada",c:RED},rendimento:{t:"Rendimento",c:GREEN}};
  return (<div className="scrollx"><table>
    <thead><tr><th style={{textAlign:"left"}}>Data</th><th style={{textAlign:"left"}}>Descrição</th><th style={{textAlign:"right"}}>Valor</th>{aoExcluir&&<th style={{width:40}}></th>}</tr></thead>
    <tbody>{linhas.map(r=>{const b=sel[r.tipo]||sel.aporte;return(
      <tr key={r.id}>
        <td style={{color:MUTED,fontSize:13.5,whiteSpace:"nowrap"}}>{fmtDate(r.date)}</td>
        <td><span className="row mid" style={{gap:10}}>
          <span className="pill" style={{color:b.c,background:b.c+"18",border:"1px solid "+b.c+"30"}}>{b.t}</span>
          <span>{r.desc}</span></span></td>
        <td className="num" style={{textAlign:"right",fontWeight:650,whiteSpace:"nowrap",color:r.tipo==="rendimento"?GREEN:r.valor<0?RED:TXT}}>
          {r.valor<0?"− ":""}{brl(Math.abs(r.valor),r.tipo==="rendimento"?2:0)}</td>
        {aoExcluir&&<td style={{textAlign:"right"}}>{r.tipo!=="rendimento"&&
          <button onClick={()=>aoExcluir(r.id)} title="Excluir" style={{background:"none",border:"none",cursor:"pointer",padding:4}}><I n="trash" s={14}/></button>}</td>}
      </tr>);})}</tbody>
  </table></div>);
}

function Formulario({fechar,salvar}){
  const [type,setType]=useState("aporte");
  const [amount,setAmount]=useState("");
  const [date,setDate]=useState(toIso(new Date()));
  const [description,setDescription]=useState("");
  const enviar=()=>{
    const v=Number(String(amount).replace(",","."));
    if(!v||v<=0) return alert("Informe um valor maior que zero.");
    if(!date) return alert("Informe a data do lançamento.");
    salvar({type,amount:v,date,description:description.trim()||(type==="aporte"?"Aporte":"Retirada")});
  };
  return (<div onClick={fechar} style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:14,background:"rgba(6,7,10,.72)",backdropFilter:"blur(6px)"}}>
    <div className="glass rise" onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:470,padding:20}}>
      <div className="row mid" style={{justifyContent:"space-between",marginBottom:18}}>
        <div><h3 style={{fontSize:17,fontWeight:650,margin:0}}>Novo lançamento</h3>
          <p style={{color:MUTED,fontSize:12.5,margin:"3px 0 0"}}>Os juros passam a contar a partir da data escolhida.</p></div>
        <button onClick={fechar} style={{background:"none",border:"none",cursor:"pointer"}}><I n="x" s={18}/></button>
      </div>
      <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {[{id:"aporte",l:"Aporte",c:GREEN},{id:"retirada",l:"Retirada",c:RED}].map(t=>(
          <button key={t.id} onClick={()=>setType(t.id)} style={{padding:"10px 0",borderRadius:12,fontSize:13.5,fontWeight:650,cursor:"pointer",
            color:type===t.id?t.c:MUTED,background:type===t.id?t.c+"14":"rgba(255,255,255,.03)",border:"1px solid "+(type===t.id?t.c+"44":LINE)}}>{t.l}</button>))}
      </div>
      <div className="grid" style={{gap:14}}>
        <Campo rotulo="Valor (R$)"><input type="number" step="0.01" placeholder="50000" value={amount} onChange={e=>setAmount(e.target.value)} autoFocus/></Campo>
        <Campo rotulo="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></Campo>
        <Campo rotulo="Descrição"><input type="text" placeholder="Investimento inicial" value={description} onChange={e=>setDescription(e.target.value)}/></Campo>
      </div>
      <div className="row" style={{gap:10,marginTop:20}}>
        <button className="btn" style={{flex:1}} onClick={fechar}>Cancelar</button>
        <button className="btn gold" style={{flex:1}} onClick={enviar}>Salvar lançamento</button>
      </div>
    </div>
  </div>);
}

function Login({fechar}){
  const [email,setEmail]=useState("");
  const [senha,setSenha]=useState("");
  const [erro,setErro]=useState("");
  const [indo,setIndo]=useState(false);
  const entrar=async()=>{
    setIndo(true); setErro("");
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:senha});
    setIndo(false);
    if(error) setErro("E-mail ou senha não conferem.");
    else fechar();
  };
  return (<div onClick={fechar} style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:14,background:"rgba(6,7,10,.72)",backdropFilter:"blur(6px)"}}>
    <div className="glass rise" onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:400,padding:20}}>
      <div className="row mid" style={{justifyContent:"space-between",marginBottom:18}}>
        <div><h3 style={{fontSize:17,fontWeight:650,margin:0}}>Entrar</h3>
          <p style={{color:MUTED,fontSize:12.5,margin:"3px 0 0"}}>Só o dono do painel pode lançar aportes.</p></div>
        <button onClick={fechar} style={{background:"none",border:"none",cursor:"pointer"}}><I n="x" s={18}/></button>
      </div>
      <div className="grid" style={{gap:14}}>
        <Campo rotulo="E-mail"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} autoFocus/></Campo>
        <Campo rotulo="Senha"><input type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/></Campo>
      </div>
      {erro&&<p style={{color:RED,fontSize:12.5,marginTop:12,marginBottom:0}}>{erro}</p>}
      <button className="btn gold" style={{width:"100%",marginTop:18}} onClick={entrar} disabled={indo}>{indo?"Entrando…":"Entrar"}</button>
    </div>
  </div>);
}

/* ══════════════ PAINEL ══════════════ */
function Painel(){
  const [entries,setEntries]=useState(INICIAL.entries);
  const [settings,setSettings]=useState(INICIAL.settings);
  const [pronto,setPronto]=useState(false);
  const [aba,setAba]=useState("visao");
  const [form,setForm]=useState(false);
  const [now,setNow]=useState(()=>Date.now());
  const [sessao,setSessao]=useState(null);
  const [login,setLogin]=useState(false);

  useEffect(()=>{const id=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(id);},[]);
  useEffect(()=>{ if(!sb) return;
    sb.auth.getSession().then(r=>setSessao(r.data.session));
    const r=sb.auth.onAuthStateChange((_e,s)=>setSessao(s));
    return()=>{ try{ r.data.subscription.unsubscribe(); }catch(e){} };
  },[]);
  const podeEditar = !sb || !!sessao;
  useEffect(()=>{(async()=>{
    const s=await dados.carregar();
    if(s&&s.entries){ setEntries(s.entries); setSettings(Object.assign({},INICIAL.settings,s.settings||{})); }
    setPronto(true);
  })();},[]);
  useEffect(()=>{ if(pronto) dados.salvar({entries,settings}); },[entries,settings,pronto]);

  const rate=settings.rate;
  const ord=useMemo(()=>[...entries].sort((a,b)=>a.date.localeCompare(b.date)),[entries]);
  const t0=ord.length?toDate(ord[0].date).getTime():now;

  const aportado=useMemo(()=>entries.filter(e=>e.type==="aporte").reduce((s,e)=>s+Math.abs(e.amount),0),[entries]);
  const retirado=useMemo(()=>entries.filter(e=>e.type==="retirada").reduce((s,e)=>s+Math.abs(e.amount),0),[entries]);
  const capital=aportado-retirado;
  const atual=useMemo(()=>valorEm(entries,rate,now),[entries,rate,now]);
  const juros=atual-capital;
  const roi=capital>0?juros/capital:0;
  const dias=Math.max(0,Math.floor((now-t0)/MS_DAY));
  const anual=Math.pow(1+rate,12)-1;
  const porDia=atual*(Math.pow(1+rate,1/AVG_MONTH)-1);
  const zero=new Date(now); zero.setHours(0,0,0,0);
  const fluxoHoje=entries.filter(e=>{const d=toDate(e.date).getTime();return d>=zero.getTime()&&d<=now;}).reduce((s,e)=>s+sig(e),0);
  const hoje=Math.max(0,atual-valorEm(entries,rate,zero.getTime())-fluxoHoje);
  const em30=valorEm(entries,rate,now+30*MS_DAY)-atual;
  const metaPct=settings.meta>0?Math.min(1,atual/settings.meta):0;

  const linha=useMemo(()=>{
    if(!ord.length) return [];
    const N=52,pts=[];
    for(let i=0;i<=N;i++){ const t=t0+((now-t0)*i)/N;
      pts.push({t,patrimonio:valorEm(entries,rate,t),aportado:capitalEm(entries,t),projecao:null}); }
    if(pts.length) pts[pts.length-1].projecao=pts[pts.length-1].patrimonio;
    for(let i=1;i<=6;i++){ const t=now+i*AVG_MONTH*MS_DAY;
      pts.push({t,patrimonio:null,aportado:capitalEm(entries,t),projecao:valorEm(entries,rate,t)}); }
    return pts;
  },[entries,rate,now,ord.length,t0]);

  const mensal=useMemo(()=>{
    if(!ord.length) return [];
    const p=toDate(ord[0].date); const out=[];
    let d=new Date(p.getFullYear(),p.getMonth(),1);
    while(d.getTime()<=now){
      const ini=new Date(d.getFullYear(),d.getMonth(),1).getTime();
      const fimReal=new Date(d.getFullYear(),d.getMonth()+1,1).getTime()-1;
      const fim=Math.min(fimReal,now);
      const fl=entries.filter(e=>{const x=toDate(e.date).getTime();return x>=ini&&x<=fim;}).reduce((s,e)=>s+sig(e),0);
      out.push({key:d.getFullYear()+"-"+d.getMonth(),mes:MESES[d.getMonth()],mesCurto:MES_CURTO[d.getMonth()],ano:d.getFullYear(),
        lucro:Math.max(0,valorEm(entries,rate,fim)-valorEm(entries,rate,ini)-fl),parcial:fimReal>now,fimIso:toIso(new Date(fim))});
      d=new Date(d.getFullYear(),d.getMonth()+1,1);
    }
    return out;
  },[entries,rate,now,ord]);

  const melhor=useMemo(()=>mensal.reduce((a,b)=>(!a||b.lucro>a.lucro?b:a),null),[mensal]);

  const extrato=useMemo(()=>{
    const l=entries.map(e=>({id:e.id,date:e.date,desc:e.description||(e.type==="aporte"?"Aporte":"Retirada"),valor:sig(e),tipo:e.type}));
    mensal.forEach(m=>{ if(m.lucro>.005) l.push({id:"r-"+m.key,date:m.fimIso,desc:m.parcial?"Rendimentos (parcial)":"Rendimentos",valor:m.lucro,tipo:"rendimento"}); });
    return l.sort((a,b)=>b.date===a.date?(a.tipo==="rendimento"?-1:1):b.date.localeCompare(a.date));
  },[entries,mensal]);

  const posicoes=useMemo(()=>ord.map(e=>{
    const t=toDate(e.date).getTime(), m=Math.max(0,meses(t,now)), v=sig(e)*cresce(rate,m);
    return Object.assign({},e,{meses:m,dias:Math.max(0,Math.floor((now-t)/MS_DAY)),atual:v,rendeu:v-sig(e),roi:cresce(rate,m)-1});
  }).reverse(),[ord,rate,now]);

  const projecao=useMemo(()=>{
    const o=[];
    for(let i=1;i<=12;i++){ const t=now+i*AVG_MONTH*MS_DAY, v=valorEm(entries,rate,t);
      const ant=valorEm(entries,rate,now+(i-1)*AVG_MONTH*MS_DAY), d=new Date(t);
      o.push({i,mes:MES_CURTO[d.getMonth()]+"/"+String(d.getFullYear()).slice(2),valor:v,ganho:v-ant,acumulado:v-capital}); }
    return o;
  },[entries,rate,now,capital]);

  const add=useCallback(e=>setEntries(p=>[...p,Object.assign({},e,{id:"e"+Date.now()+Math.random().toString(36).slice(2,6)})]),[]);
  const del=useCallback(id=>setEntries(p=>p.filter(x=>x.id!==id)),[]);
  const exportar=()=>{ const b=new Blob([JSON.stringify({entries,settings},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="painel-investidor-"+toIso(new Date())+".json"; a.click(); URL.revokeObjectURL(a.href); };
  const importar=f=>{ const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(Array.isArray(d.entries)) setEntries(d.entries);
      if(d.settings) setSettings(Object.assign({},INICIAL.settings,d.settings));
    }catch(e){ alert("Arquivo inválido. Escolha um backup exportado por este painel."); } };
    r.readAsText(f); };

  const ABAS=[{id:"visao",l:"Visão geral",i:"grid"},{id:"aportes",l:"Aportes",i:"wallet"},
    {id:"extrato",l:"Extrato",i:"receipt"},{id:"projecao",l:"Projeções",i:"target"},{id:"config",l:"Ajustes",i:"cog"}];

  return (<div className="wrap">
    {/* Cabeçalho */}
    <header style={{marginBottom:26}}>
      <div className="row wrapf" style={{justifyContent:"space-between",gap:16,alignItems:"flex-start"}}>
        <div>
          <div className="row mid" style={{gap:10,marginBottom:10}}>
            <span className="icobox" style={{width:34,height:34,borderRadius:11,background:"linear-gradient(145deg,"+GOLD+",#8c6f18)",boxShadow:"0 8px 24px -10px "+GOLD}}>
              <I n="spark" c="#0F1115" s={17} w={2.4}/></span>
            <div style={{height:22,width:1,background:LINE}}/>
            <Eyebrow>{settings.nome}</Eyebrow>
          </div>
          <h1 style={{fontSize:34,fontWeight:700,letterSpacing:"-.035em",lineHeight:1.05,margin:0,
            background:"linear-gradient(100deg,"+TXT+" 35%,"+GOLD+")",WebkitBackgroundClip:"text",backgroundClip:"text",color:"transparent"}}>Painel do Investidor</h1>
          <p style={{color:MUTED,fontSize:14.5,margin:"6px 0 0"}}>Acompanhamento em tempo real</p>
        </div>
        <div className="row mid" style={{gap:8}}>
          <div className="glass row mid" style={{borderRadius:999,padding:"8px 14px",gap:8}}>
            <span className="dot"/><span style={{fontSize:12.5,color:MUTED}}>Hoje</span>
            <strong className="num" style={{fontSize:13,color:GREEN}}>+{brl(hoje)}</strong>
          </div>
          {podeEditar
            ? <button className="btn gold" onClick={()=>setForm(true)}><I n="plus" c="#12140f" s={14}/> Novo lançamento</button>
            : <button className="btn" onClick={()=>setLogin(true)}>Somente leitura · Entrar</button>}
        </div>
      </div>
      <nav className="row scrollx" style={{marginTop:24,gap:4,borderBottom:"1px solid "+LINE,paddingBottom:1}}>
        {ABAS.map(t=>(<button key={t.id} className={"tabbtn"+(aba===t.id?" on":"")} onClick={()=>setAba(t.id)}>
          <I n={t.i} c={aba===t.id?GOLD:MUTED} s={15}/>{t.l}</button>))}
      </nav>
    </header>

    {/* VISÃO GERAL */}
    {aba==="visao"&&(<React.Fragment>
      <div className="grid g4" style={{marginBottom:26}}>
        <Card ico="wallet" emoji="💰" rotulo="Valor investido" valor={brl(capital,0)} cor={GOLD} atraso={0}
          sub={retirado>0?brl(aportado,0)+" aportados · "+brl(retirado,0)+" retirados":entries.filter(e=>e.type==="aporte").length+" aporte(s) · "+dias+" dias"}/>
        <Card ico="trend" emoji="📈" rotulo="Valorização" valor={pct(roi)} cor={GREEN} atraso={70}
          sub={(rate*100).toFixed(2).replace(".",",")+"% ao mês · "+(dias/AVG_MONTH).toFixed(1).replace(".",",")+" meses"}/>
        <Card ico="bank" emoji="💵" rotulo="Valor atual" valor={brl(atual)} cor={GOLD} atraso={140} vivo sub={"+"+brl(porDia)+" por dia"}/>
        <Card ico="coin" emoji="💸" rotulo="Lucro acumulado" valor={brl(juros)} cor={GREEN} atraso={210} sub={"Próximos 30 dias: +"+brl(em30,0)}/>
      </div>

      <div className="glass rise" style={{padding:18,marginBottom:26,animationDelay:"260ms"}}>
        <div className="row mid wrapf" style={{justifyContent:"space-between",gap:8,marginBottom:12}}>
          <span className="row mid" style={{gap:8}}><I n="target" c={GOLD} s={15}/>
            <span style={{fontSize:13.5,fontWeight:600}}>Meta de patrimônio</span>
            <span style={{color:MUTED,fontSize:12.5}}>· {brl(settings.meta,0)}</span></span>
          <span className="num" style={{fontSize:13,color:GOLD,fontWeight:650}}>{(metaPct*100).toFixed(1).replace(".",",")}%</span>
        </div>
        <div style={{height:8,borderRadius:99,background:"rgba(255,255,255,.06)",overflow:"hidden"}}>
          <div style={{width:(metaPct*100)+"%",height:"100%",borderRadius:99,background:"linear-gradient(90deg,"+GREEN+","+GOLD+")",transition:"width 1.2s cubic-bezier(.16,1,.3,1)"}}/>
        </div>
        <div style={{color:MUTED,fontSize:12.5,marginTop:9}}>
          Faltam {brl(Math.max(0,settings.meta-atual),0)} — cerca de {Math.max(0,Math.ceil(Math.log(Math.max(1,settings.meta/Math.max(1,atual)))/Math.log(1+rate)))} meses no ritmo atual.
        </div>
      </div>

      <Secao titulo="Crescimento do Patrimônio" dica="Linha cheia dourada: realizado. Pontilhado verde: projeção dos próximos 6 meses.">
        <GraficoLinha dados={linha}/>
      </Secao>

      <Secao titulo="Rendimentos Mensais" dica={melhor?"Melhor mês: "+melhor.mes+" · "+brl(melhor.lucro,0):"Sem dados ainda."}>
        <GraficoBarras dados={mensal}/>
        <div className="row mid" style={{gap:18,marginTop:10,paddingLeft:4,color:MUTED,fontSize:12}}>
          <span className="row mid" style={{gap:6}}><i style={{width:9,height:9,borderRadius:3,background:GREEN,display:"inline-block"}}/> Mês fechado</span>
          <span className="row mid" style={{gap:6}}><i style={{width:9,height:9,borderRadius:3,background:GOLD,display:"inline-block"}}/> Mês em andamento</span>
        </div>
      </Secao>

      <Secao titulo="Movimentações recentes" dica="Aportes, retiradas e rendimentos apurados."
        direita={<button className="btn" onClick={()=>setAba("extrato")}>Ver tudo <I n="right" s={14}/></button>}>
        <Tabela linhas={extrato.slice(0,8)}/>
      </Secao>

      <div className="grid g3">
        {[{l:"ROI Total",v:pct(roi),s:brl(juros,0)+" de lucro em "+dias+" dias",c:GREEN},
          {l:"Rentabilidade Mensal",v:pct(rate),s:"Taxa fixa contratada",c:GOLD},
          {l:"Rentabilidade Anual Estimada",v:pct(anual),s:"Juros compostos sobre 12 meses",c:GOLD}].map((f,i)=>(
          <div key={f.l} className="glass rise" style={{padding:18,animationDelay:(i*80)+"ms"}}>
            <Eyebrow>{f.l}</Eyebrow>
            <div className="num" style={{color:f.c,fontSize:27,fontWeight:700,letterSpacing:"-.02em",marginTop:8}}>{f.v}</div>
            <div style={{color:MUTED,fontSize:12.5,marginTop:4}}>{f.s}</div>
          </div>))}
      </div>
    </React.Fragment>)}

    {/* APORTES */}
    {aba==="aportes"&&(<React.Fragment>
      <div className="grid g3" style={{marginBottom:22}}>
        <Card ico="wallet" rotulo="Capital em operação" valor={brl(capital,0)} cor={GOLD}/>
        <Card ico="pulse" rotulo="Posições ativas" valor={String(posicoes.length)} cor={GOLD} sub={"Desde "+(ord.length?fmtDate(ord[0].date):"—")}/>
        <Card ico="coin" rotulo="Rendendo agora" valor={"+"+brl(porDia)+"/dia"} cor={GREEN} vivo sub={"+"+brl(porDia/24)+" por hora"}/>
      </div>
      <Secao titulo="Seus aportes" dica="Cada lançamento com data, tempo aplicado e quanto já rendeu."
        direita={podeEditar?<button className="btn gold" onClick={()=>setForm(true)}><I n="plus" c="#12140f" s={14}/> Adicionar</button>:null}>
        {!posicoes.length?(
          <div style={{textAlign:"center",padding:"48px 0"}}>
            <div style={{fontSize:15,fontWeight:600}}>Nenhum lançamento ainda</div>
            <p style={{color:MUTED,fontSize:13,margin:"6px 0 16px"}}>Registre o primeiro aporte para o painel começar a calcular.</p>
            {podeEditar&&<button className="btn gold" onClick={()=>setForm(true)}><I n="plus" c="#12140f" s={14}/> Adicionar aporte</button>}
          </div>
        ):(<div className="grid" style={{gap:10}}>
          {posicoes.map(p=>{const neg=p.type==="retirada";return(
            <div key={p.id} style={{border:"1px solid "+LINE,borderRadius:16,background:"rgba(255,255,255,.02)",padding:16}}>
              <div className="row mid wrapf" style={{gap:14,justifyContent:"space-between"}}>
                <div className="row mid" style={{gap:12,minWidth:0}}>
                  <span className="icobox" style={{width:36,height:36,borderRadius:12,background:neg?"rgba(246,70,93,.12)":GREEN+"1A",border:"1px solid "+(neg?"rgba(246,70,93,.25)":GREEN+"33")}}>
                    <I n={neg?"aDown":"aUp"} c={neg?RED:GREEN}/></span>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:14.5,fontWeight:600}}>{p.description}</div>
                    <div className="row mid" style={{gap:6,color:MUTED,fontSize:12.5}}>
                      <I n="cal" s={12}/> {fmtDate(p.date)} · {p.dias} dias · {p.meses.toFixed(2).replace(".",",")} meses</div>
                  </div>
                </div>
                <div className="row mid" style={{gap:22,marginLeft:"auto"}}>
                  <Col r="Valor" v={brl(Math.abs(p.amount),0)}/>
                  <Col r="Valor hoje" v={brl(Math.abs(p.atual))} c={GOLD}/>
                  <Col r="Rendeu" v={"+"+brl(Math.abs(p.rendeu))} c={GREEN} sub={pct(p.roi)}/>
                  {podeEditar&&<button onClick={()=>del(p.id)} title="Excluir" style={{background:"none",border:"none",cursor:"pointer",padding:6}}><I n="trash" s={15}/></button>}
                </div>
              </div>
              <div style={{marginTop:12,height:4,borderRadius:99,background:"rgba(255,255,255,.05)",overflow:"hidden"}}>
                <div style={{width:Math.min(100,(Math.abs(p.rendeu)/Math.max(1,Math.abs(p.atual)))*100)+"%",height:"100%",background:"linear-gradient(90deg,"+GREEN+","+GOLD+")",transition:"width 1s ease"}}/>
              </div>
            </div>);})}
        </div>)}
      </Secao>
    </React.Fragment>)}

    {/* EXTRATO */}
    {aba==="extrato"&&(
      <Secao titulo="Extrato completo" dica="Lançamentos e rendimentos apurados mês a mês."
        direita={<button className="btn" onClick={exportar}><I n="down" s={14}/> Exportar</button>}>
        <Tabela linhas={extrato} aoExcluir={podeEditar?del:null}/>
      </Secao>)}

    {/* PROJEÇÕES */}
    {aba==="projecao"&&(<React.Fragment>
      <div className="grid g3" style={{marginBottom:22}}>
        <Card ico="pct" rotulo="Em 6 meses" valor={brl(valorEm(entries,rate,now+6*AVG_MONTH*MS_DAY),0)} cor={GOLD}/>
        <Card ico="pct" rotulo="Em 12 meses" valor={brl(valorEm(entries,rate,now+12*AVG_MONTH*MS_DAY),0)} cor={GOLD}/>
        <Card ico="trend" rotulo="Rentabilidade anual" valor={pct(anual)} cor={GREEN} sub="Sem novos aportes"/>
      </div>
      <Secao titulo="Projeção mês a mês" dica="Considera apenas o capital de hoje, sem novos aportes.">
        <div className="scrollx"><table>
          <thead><tr><th style={{textAlign:"left"}}>Mês</th><th style={{textAlign:"right"}}>Ganho no mês</th>
            <th style={{textAlign:"right"}}>Lucro acumulado</th><th style={{textAlign:"right"}}>Patrimônio</th></tr></thead>
          <tbody>{projecao.map(p=>(<tr key={p.i}>
            <td>{p.mes}</td>
            <td style={{textAlign:"right",color:GREEN}}>+{brl(p.ganho,0)}</td>
            <td style={{textAlign:"right",color:MUTED}}>{brl(p.acumulado,0)}</td>
            <td style={{textAlign:"right",color:GOLD,fontWeight:650}}>{brl(p.valor,0)}</td></tr>))}</tbody>
        </table></div>
      </Secao>
    </React.Fragment>)}

    {/* AJUSTES */}
    {aba==="config"&&(<React.Fragment>
      <Secao titulo="Parâmetros" dica="Qualquer mudança recalcula o painel inteiro na hora.">
        <div className="grid g3">
          <Campo rotulo="Taxa mensal (%)"><input disabled={!podeEditar} type="number" step="0.1" value={(settings.rate*100).toFixed(2)}
            onChange={e=>setSettings(s=>Object.assign({},s,{rate:Math.max(0,Number(e.target.value)/100)}))}/></Campo>
          <Campo rotulo="Meta de patrimônio (R$)"><input disabled={!podeEditar} type="number" step="1000" value={settings.meta}
            onChange={e=>setSettings(s=>Object.assign({},s,{meta:Number(e.target.value)}))}/></Campo>
          <Campo rotulo="Nome da carteira"><input disabled={!podeEditar} type="text" value={settings.nome}
            onChange={e=>setSettings(s=>Object.assign({},s,{nome:e.target.value}))}/></Campo>
        </div>
        <p style={{color:MUTED,fontSize:12.5,marginTop:16,lineHeight:1.6}}>
          Os juros são compostos e calculados por fração de mês (base de 30,44 dias). Por isso o valor sobe continuamente,
          e não apenas na virada do mês. {sb?"Os dados estão sincronizados com o Supabase.":"Os dados estão salvos neste navegador."}
        </p>
      </Secao>
      <Secao titulo="Backup dos dados" dica="Baixe um arquivo com tudo, ou restaure de um backup anterior.">
        <div className="row wrapf" style={{gap:10}}>
          <button className="btn" onClick={exportar}><I n="down" s={14}/> Exportar JSON</button>
          {podeEditar&&<label className="btn" style={{margin:0}}>
            <input type="file" accept="application/json" style={{display:"none"}} onChange={e=>e.target.files[0]&&importar(e.target.files[0])}/>
            <I n="up" s={14}/> Importar JSON
          </label>}
          {podeEditar&&<button className="btn danger" onClick={()=>{if(confirm("Apagar todos os lançamentos?")) setEntries([]);}}><I n="trash" c={RED} s={14}/> Limpar lançamentos</button>}
        </div>
      </Secao>
    </React.Fragment>)}

    <footer className="row mid wrapf" style={{marginTop:36,paddingTop:20,borderTop:"1px solid "+LINE,color:MUTED,fontSize:12,justifyContent:"space-between",gap:10}}>
      <span>{settings.nome} · taxa de {(rate*100).toFixed(2).replace(".",",")}% ao mês</span>
      <span className="row mid" style={{gap:14}}>
        Atualizado às {new Date(now).toLocaleTimeString("pt-BR")}
        {sb&&(sessao
          ? <button className="btn" style={{padding:"5px 10px",fontSize:11.5}} onClick={()=>sb.auth.signOut()}>Sair</button>
          : <button className="btn" style={{padding:"5px 10px",fontSize:11.5}} onClick={()=>setLogin(true)}>Entrar</button>)}
      </span>
    </footer>

    {form&&<Formulario fechar={()=>setForm(false)} salvar={e=>{add(e);setForm(false);}}/>}
    {login&&<Login fechar={()=>setLogin(false)}/>}
  </div>);
}

function Col({r,v,sub,c=TXT}){
  return (<div style={{textAlign:"right"}}>
    <div style={{color:MUTED,fontSize:10.5,letterSpacing:".1em",textTransform:"uppercase",fontWeight:600}}>{r}</div>
    <div className="num" style={{color:c,fontSize:14.5,fontWeight:650,marginTop:2}}>{v}</div>
    {sub&&<div style={{color:GREEN,fontSize:11.5}}>{sub}</div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Painel/>);
document.getElementById("boot").style.display="none";
</script>
</body>
</html>
