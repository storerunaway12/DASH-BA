<meta name="theme-color" content="#FFFFFF" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --wash:#F5F9F7; --ink:#101828; --muted:#667085;
    --line:#E7EBEF; --acento:#0F9D63; --positivo:#12B76A; --suave:#A7E8CB; --red:#D92D20;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; font-size:15px;
    font-family:Nunito,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow-x:hidden;
  }
  button{font-family:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:28px 16px 40px;position:relative}
  @media(min-width:640px){.wrap{padding:40px 24px 56px}}
  .glass{background:#fff;border:1px solid var(--line);border-radius:22px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 34px -22px rgba(16,24,40,.30)}
  .atmos{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(55% 38% at 8% -6%,#0F9D6314,transparent 62%),radial-gradient(45% 30% at 96% 0%,#12B76A0d,transparent 60%)}
  .eyebrow{color:var(--muted);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .row{display:flex}.mid{align-items:center}.wrapf{flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:1fr}
  @media(min-width:640px){.g4{grid-template-columns:1fr 1fr}}
  @media(min-width:1100px){.g4{grid-template-columns:repeat(4,1fr)}}
  .g3{grid-template-columns:1fr}
  @media(min-width:640px){.g3{grid-template-columns:repeat(3,1fr)}}
  input,select{width:100%;background:#F9FAFB;border:1px solid var(--line);border-radius:14px;
    color:var(--ink);padding:11px 13px;font-size:15px;outline:none;font-variant-numeric:tabular-nums;font-family:inherit;font-weight:600}
  input::placeholder{color:#9AA3AF;font-weight:400}
  input:focus{border-color:var(--acento);box-shadow:0 0 0 3px #0F9D631f;background:#fff}
  input:disabled{background:#F2F4F7;color:var(--muted)}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:0 12px 12px;white-space:nowrap}
  td{padding:14px 12px;font-size:14.5px;border-top:1px solid var(--line);font-weight:600}
  .tabbtn{display:flex;align-items:center;gap:8px;padding:10px 14px;white-space:nowrap;background:none;
    border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--muted);transition:.2s}
  .tabbtn.on{color:var(--ink);font-weight:800;border-bottom-color:var(--acento)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:14px;
    font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;
    background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(16,24,40,.35)}
  .btn.gold{background:var(--acento);border-color:var(--acento);color:#fff;box-shadow:0 8px 20px -10px #0F9D63}
  .btn.danger{background:#FEF3F2;border-color:#FDA29B;color:var(--red)}
  .pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .icobox{display:grid;place-items:center;border-radius:12px;flex-shrink:0}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 #12B76A66}50%{opacity:.5;box-shadow:0 0 0 5px #12B76A00}}
  .rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--positivo);animation:pulse 1.8s ease-in-out infinite}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#D7DBE0;border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
  .scrollx{overflow-x:auto}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:99;color:#667085;font-size:14px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function nomeDe(sessao){
  if(!sessao||!sessao.user) return "";
  const u=sessao.user, meta=u.user_metadata||{};
  if(meta.nome) return meta.nome;
  if(meta.name) return meta.name;
  if(CONFIG.NOMES&&CONFIG.NOMES[u.email]) return CONFIG.NOMES[u.email];
  const p=String(u.email||"").split("@")[0].replace(/[._-]+/g," ").trim();
  return p.charAt(0).toUpperCase()+p.slice(1);
}

const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ─── cores ─── */
const ACENTO="#0F9D63", POSITIVO="#12B76A", SUAVE="#A7E8CB", RED="#D92D20", BG="#FFFFFF",
      TXT="#101828", MUTED="#667085", LINE="#E7EBEF";

/* ─── datas e dinheiro ─── */
const MS_DAY=86400000;
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES_CURTO=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const brl=(v,d=2)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:d,maximumFractionDigits:d}).format(v||0);
const curto=(v)=>{const a=Math.abs(v||0);
  if(a>=1e6) return "R$ "+(v/1e6).toFixed(1).replace(".",",")+"M";
  if(a>=1e3) return "R$ "+Math.round(v/1e3)+"k";
  return "R$ "+Math.round(v||0);};
const pct=(v,d=2)=>(v>=0?"+":"")+(v*100).toFixed(d).replace(".",",")+"%";
const toDate=(s)=>new Date(s+"T12:00:00");
const toIso=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDate=(s)=>toDate(s).toLocaleDateString("pt-BR");

/* ─── rendimento: 10% a cada ciclo de 30 dias ───
   Ao fechar 30 dias, o valor recebe a taxa cheia sobre o saldo do ciclo anterior
   (3.000 → 3.300 → 3.630). Dentro do ciclo em andamento o rendimento aparece
   proporcional aos dias corridos, sem juros sobre juros diário.            */
const CICLO=30;
const ciclos=(a,b)=>(b-a)/(CICLO*MS_DAY);
const sig=(e)=>e.type==="retirada"?-Math.abs(e.amount):Math.abs(e.amount);
function rende(base,r,c){
  if(c<=0) return base;
  const fechados=Math.floor(c), resto=c-fechados;
  const saldo=base*Math.pow(1+r,fechados);
  return saldo+saldo*r*resto;
}
const valorEm=(es,r,t)=>es.reduce((s,e)=>{const d=toDate(e.date).getTime();return d>t?s:s+rende(sig(e),r,ciclos(d,t));},0);
const capitalEm=(es,t)=>es.reduce((s,e)=>toDate(e.date).getTime()>t?s:s+sig(e),0);

/* ─── onde os dados ficam guardados ─── */
const CHAVE="painel-investidor:v1";
const temSupabase = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
const sb = temSupabase ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const dados = {
  async carregar(){
    if(sb){
      try{
        const {data,error}=await sb.from("carteira").select("dados").eq("id",CONFIG.CARTEIRA_ID).maybeSingle();
        if(error) throw error;
        if(data && data.dados && data.dados.entries){ localStorage.setItem(CHAVE,JSON.stringify(data.dados)); return data.dados; }
      }catch(e){ console.warn("Supabase indisponível, usando dados do navegador.",e); }
    }
    try{ const r=localStorage.getItem(CHAVE); return r?JSON.parse(r):null; }catch(e){ return null; }
  },
  async salvar(estado){
    try{ localStorage.setItem(CHAVE,JSON.stringify(estado)); }catch(e){}
    if(!sb) return;
    try{
      const ses=await sb.auth.getSession();
      if(!ses.data.session) return; // visitante: pode ver, não pode alterar
      const {error}=await sb.from("carteira").upsert({id:CONFIG.CARTEIRA_ID,dados:estado,atualizado_em:new Date().toISOString()});
      if(error) throw error;
    }catch(e){ console.warn("Não deu para salvar no Supabase. Ficou salvo no navegador.",e); }
  }
};

const INICIAL={

};

/* ══════════════ ÍCONES ══════════════ */
const P={

  aUp:"M7 17 17 7M7 7h10v10",

  cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",

  coin:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v10M15 9.5c0-1.1-1.3-2-3-2s-3 .9-3 2 1.3 2 3 2 3 .9 3 2-1.3 2-3 2-3-.9-3-2",
  bank:"M3 21h18M4 10h16M5 10V6l7-4 7 4v4M7 10v11M12 10v11M17 10v11",
  pct:"M19 5 5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z",

function I({n,s=16,c=MUTED,w=2}){
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={w} strokeLinecap="round" strokeLinejoin="round"><path d={P[n]}/></svg>;
}

/* ══════════════ MEDIDOR DE LARGURA ══════════════ */
function useLargura(){
  const ref=useRef(null); const [w,setW]=useState(760);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const medir=()=>setW(el.clientWidth||760);
    medir();
    let ro; if(window.ResizeObserver){ ro=new ResizeObserver(medir); ro.observe(el); }
    else window.addEventListener("resize",medir);
    return()=>{ ro?ro.disconnect():window.removeEventListener("resize",medir); };
  },[]);
  return [ref,w];
}
const tetoBonito=(v)=>{ if(v<=0) return 100;
  const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; };

/* ══════════════ GRÁFICO DE LINHA ══════════════ */
function GraficoLinha({dados:ds,altura=300}){
  const [ref,W]=useLargura();
  const [hi,setHi]=useState(null);
  if(!ds.length) return <div ref={ref} style={{height:altura,display:"grid",placeItems:"center",color:MUTED,fontSize:13}}>Sem dados para exibir.</div>;

  const H=altura, pL=64,pR=14,pT=16,pB=28;
  const iw=Math.max(10,W-pL-pR), ih=H-pT-pB;
  const maxV=tetoBonito(Math.max(...ds.map(d=>Math.max(d.patrimonio||0,d.projecao||0,d.aportado||0))));
  const X=(i)=>pL+(i/(ds.length-1))*iw;
  const Y=(v)=>pT+(1-(v||0)/maxV)*ih;
  const linha=(k)=>{ let d="",aberto=false;
    ds.forEach((p,i)=>{ const v=p[k]; if(v==null){aberto=false;return;} d+=(aberto?" L":" M")+X(i)+","+Y(v); aberto=true; });
    return d.trim(); };
  const area=()=>{ const pts=ds.map((p,i)=>p.patrimonio!=null?[X(i),Y(p.patrimonio)]:null).filter(Boolean);
    if(!pts.length) return "";
    return "M"+pts[0][0]+","+(pT+ih)+" L"+pts.map(p=>p[0]+","+p[1]).join(" L")+" L"+pts[pts.length-1][0]+","+(pT+ih)+" Z"; };
  const ticks=[0,.25,.5,.75,1].map(f=>maxV*f);
  const rotulosX=[0,Math.floor(ds.length*.25),Math.floor(ds.length*.5),Math.floor(ds.length*.75),ds.length-1];

  const mover=(e)=>{ const r=e.currentTarget.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const i=Math.round(((x-pL)/iw)*(ds.length-1));
    setHi(i>=0&&i<ds.length?i:null); };

  const p=hi!=null?ds[hi]:null;
  return (
    <div ref={ref} style={{position:"relative"}}>
      <svg width="100%" height={H} onMouseMove={mover} onMouseLeave={()=>setHi(null)} onTouchMove={mover} style={{display:"block",touchAction:"pan-y"}}>
        <defs>
          <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={POSITIVO} stopOpacity=".22"/><stop offset="100%" stopColor={POSITIVO} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {ticks.map((t,i)=>(<g key={i}>
          <line x1={pL} x2={W-pR} y1={Y(t)} y2={Y(t)} stroke={LINE}/>
          <text x={pL-10} y={Y(t)+4} textAnchor="end" fill={MUTED} fontSize="11">{curto(t)}</text>
        </g>))}
        {rotulosX.map((i,k)=>(<text key={k} x={X(i)} y={H-8} textAnchor={k===0?"start":k===4?"end":"middle"} fill={MUTED} fontSize="11">
          {new Date(ds[i].t).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}</text>))}
        <path d={area()} fill="url(#ga)"/>
        <path d={linha("aportado")} fill="none" stroke={MUTED} strokeWidth="1.4" strokeDasharray="2 4"/>
        <path d={linha("patrimonio")} fill="none" stroke={TXT} strokeWidth="2.6"/>
        <path d={linha("projecao")} fill="none" stroke={POSITIVO} strokeWidth="2" strokeDasharray="5 5"/>
        {p&&(<g>
          <line x1={X(hi)} x2={X(hi)} y1={pT} y2={pT+ih} stroke={ACENTO} strokeOpacity=".35"/>
          <circle cx={X(hi)} cy={Y(p.patrimonio!=null?p.patrimonio:p.projecao)} r="4.5" fill={p.patrimonio!=null?TXT:POSITIVO} stroke={BG} strokeWidth="2.5"/>
        </g>)}
      </svg>
      {p&&(<div className="glass" style={{position:"absolute",top:6,left:Math.min(Math.max(X(hi)-70,pL),W-160),padding:"9px 12px",borderRadius:12,pointerEvents:"none",minWidth:150}}>
        <div style={{color:MUTED,fontSize:11,marginBottom:3}}>{new Date(p.t).toLocaleDateString("pt-BR")}</div>
        <div className="num" style={{fontSize:14,color:p.patrimonio!=null?TXT:POSITIVO,fontWeight:800}}>{brl(p.patrimonio!=null?p.patrimonio:p.projecao,0)}</div>
        <div className="num" style={{fontSize:11.5,color:MUTED}}>Capital: {brl(p.aportado,0)}</div>
      </div>)}
    </div>
  );
}

/* ══════════════ GRÁFICO DE BARRAS ══════════════ */
function GraficoBarras({dados:ds,altura=270}){
  const [ref,W]=useLargura();
  const [hi,setHi]=useState(null);
  if(!ds.length) return <div ref={ref} style={{height:altura,display:"grid",placeItems:"center",color:MUTED,fontSize:13}}>Sem meses fechados ainda.</div>;

  const H=altura,pL=64,pR=14,pT=16,pB=30;
  const iw=Math.max(10,W-pL-pR), ih=H-pT-pB;
  const maxV=tetoBonito(Math.max(...ds.map(d=>d.lucro),1));
  const passo=iw/ds.length, larg=Math.min(54,passo*.58);
  const Y=(v)=>pT+(1-v/maxV)*ih;
  const barra=(x,y,w,h,r)=>{ r=Math.min(r,h,w/2);
    return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`; };
  const ticks=[0,.25,.5,.75,1].map(f=>maxV*f);
  const curtoNome=ds.length>7;

  return (
    <div ref={ref} style={{position:"relative"}}>
      <svg width="100%" height={H} style={{display:"block"}} onMouseLeave={()=>setHi(null)}>
        <defs>
          <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={POSITIVO} stopOpacity=".95"/><stop offset="100%" stopColor={POSITIVO} stopOpacity=".22"/></linearGradient>
          <linearGradient id="gbp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={SUAVE} stopOpacity="1"/><stop offset="100%" stopColor={SUAVE} stopOpacity=".45"/></linearGradient>
        </defs>
        {ticks.map((t,i)=>(<g key={i}>
          <line x1={pL} x2={W-pR} y1={Y(t)} y2={Y(t)} stroke={LINE}/>
          <text x={pL-10} y={Y(t)+4} textAnchor="end" fill={MUTED} fontSize="11">{curto(t)}</text>
        </g>))}
        {ds.map((d,i)=>{
          const x=pL+passo*i+(passo-larg)/2, y=Y(d.lucro), h=Math.max(2,pT+ih-y);
          return (<g key={d.key} onMouseEnter={()=>setHi(i)}>
            <rect x={pL+passo*i} y={pT} width={passo} height={ih} fill={hi===i?"rgba(255,255,255,.03)":"transparent"}/>
            <path d={barra(x,y,larg,h,7)} fill={d.parcial?"url(#gbp)":"url(#gb)"}/>
            {(passo>=30||i%2===0)&&<text x={pL+passo*i+passo/2} y={H-9} textAnchor="middle" fill={MUTED} fontSize="11.5" fontWeight="600">{curtoNome?d.mesCurto:d.mes}</text>}
          </g>);
        })}
      </svg>
      {hi!=null&&(<div className="glass" style={{position:"absolute",top:6,left:Math.min(Math.max(pL+passo*hi-40,pL),W-170),padding:"9px 12px",borderRadius:12,pointerEvents:"none",minWidth:150}}>
        <div style={{color:MUTED,fontSize:11,marginBottom:3}}>{ds[hi].mes} {ds[hi].ano}{ds[hi].parcial?" · em andamento":""}</div>
        <div className="num" style={{fontSize:14,color:ds[hi].parcial?TXT:POSITIVO,fontWeight:800}}>{brl(ds[hi].lucro)}</div>
      </div>)}
    </div>
  );
}

  return (<div onClick={fechar} style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:14,background:"rgba(6,7,10,.72)",backdropFilter:"blur(6px)"}}>
    <div className="glass rise" onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:470,padding:20}}>
      <div className="row mid" style={{justifyContent:"space-between",marginBottom:18}}>
        <div><h3 style={{fontSize:17,fontWeight:650,margin:0}}>Novo lançamento</h3>
          <p style={{color:MUTED,fontSize:12.5,margin:"3px 0 0"}}>Os juros passam a contar a partir da data escolhida.</p></div>
        <button onClick={fechar} style={{background:"none",border:"none",cursor:"pointer"}}><I n="x" s={18}/></button>
      </div>
      <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {[{id:"aporte",l:"Aporte",c:POSITIVO},{id:"retirada",l:"Retirada",c:RED}].map(t=>(
          <button key={t.id} onClick={()=>setType(t.id)} style={{padding:"10px 0",borderRadius:12,fontSize:13.5,fontWeight:650,cursor:"pointer",
            color:type===t.id?t.c:MUTED,background:type===t.id?t.c+"14":"rgba(255,255,255,.03)",border:"1px solid "+(type===t.id?t.c+"44":LINE)}}>{t.l}</button>))}
      </div>

            <I n="spark" c="#fff" s={19} w={2.4}/></span>

/* ══════════════ PAINEL ══════════════ */
function Painel({sessao}){
  const [entries,setEntries]=useState(INICIAL.entries);
  const [settings,setSettings]=useState(INICIAL.settings);
  const [pronto,setPronto]=useState(false);
  const [aba,setAba]=useState("visao");
  const [form,setForm]=useState(false);
  const [now,setNow]=useState(()=>Date.now());

  useEffect(()=>{const id=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(id);},[]);
  const meuEmail=sessao&&sessao.user?String(sessao.user.email||""):"";
  const podeEditar=!sb||!CONFIG.DONO||meuEmail.toLowerCase()===String(CONFIG.DONO).toLowerCase();
  const nome=nomeDe(sessao);
  useEffect(()=>{(async()=>{
    const s=await dados.carregar();
    if(s&&s.entries){ setEntries(s.entries); setSettings(Object.assign({},INICIAL.settings,s.settings||{})); }
    setPronto(true);
  })();},[]);
  useEffect(()=>{ if(pronto&&podeEditar) dados.salvar({entries,settings}); },[entries,settings,pronto,podeEditar]);

  const rate=settings.rate;
  const ord=useMemo(()=>[...entries].sort((a,b)=>a.date.localeCompare(b.date)),[entries]);
  const t0=ord.length?toDate(ord[0].date).getTime():now;

  const aportado=useMemo(()=>entries.filter(e=>e.type==="aporte").reduce((s,e)=>s+Math.abs(e.amount),0),[entries]);
  const retirado=useMemo(()=>entries.filter(e=>e.type==="retirada").reduce((s,e)=>s+Math.abs(e.amount),0),[entries]);
  const capital=aportado-retirado;
  const atual=useMemo(()=>valorEm(entries,rate,now),[entries,rate,now]);
  const juros=atual-capital;
  const roi=capital>0?juros/capital:0;
  const dias=Math.max(0,Math.floor((now-t0)/MS_DAY));
  const anual=Math.pow(1+rate,12)-1;
  const porDia=valorEm(entries,rate,now+MS_DAY)-atual;
  const zero=new Date(now); zero.setHours(0,0,0,0);
  const fluxoHoje=entries.filter(e=>{const d=toDate(e.date).getTime();return d>=zero.getTime()&&d<=now;}).reduce((s,e)=>s+sig(e),0);
  const hoje=Math.max(0,atual-valorEm(entries,rate,zero.getTime())-fluxoHoje);
  const em30=valorEm(entries,rate,now+30*MS_DAY)-atual;
  const metaPct=settings.meta>0?Math.min(1,atual/settings.meta):0;

  const linha=useMemo(()=>{
    if(!ord.length) return [];
    const N=52,pts=[];
    for(let i=0;i<=N;i++){ const t=t0+((now-t0)*i)/N;
      pts.push({t,patrimonio:valorEm(entries,rate,t),aportado:capitalEm(entries,t),projecao:null}); }
    if(pts.length) pts[pts.length-1].projecao=pts[pts.length-1].patrimonio;
    for(let i=1;i<=6;i++){ const t=now+i*CICLO*MS_DAY;
      pts.push({t,patrimonio:null,aportado:capitalEm(entries,t),projecao:valorEm(entries,rate,t)}); }
    return pts;
  },[entries,rate,now,ord.length,t0]);

  const mensalHist=useMemo(()=>{
    if(!ord.length) return [];
    const p=toDate(ord[0].date); const out=[];
    let d=new Date(p.getFullYear(),p.getMonth(),1);
    while(d.getTime()<=now){
      const ini=new Date(d.getFullYear(),d.getMonth(),1).getTime();
      const fimReal=new Date(d.getFullYear(),d.getMonth()+1,1).getTime()-1;
      const fim=Math.min(fimReal,now);
      const fl=entries.filter(e=>{const x=toDate(e.date).getTime();return x>=ini&&x<=fim;}).reduce((s,e)=>s+sig(e),0);
      out.push({key:d.getFullYear()+"-"+d.getMonth(),mes:MESES[d.getMonth()],mesCurto:MES_CURTO[d.getMonth()],ano:d.getFullYear(),
        lucro:Math.max(0,valorEm(entries,rate,fim)-valorEm(entries,rate,ini)-fl),parcial:fimReal>now,fimIso:toIso(new Date(fim))});
      d=new Date(d.getFullYear(),d.getMonth()+1,1);
    }
    return out;
  },[entries,rate,now,ord]);

  // Sempre 12 meses na tela: os 11 anteriores mais o atual.
  // Quando o mês vira, o mais antigo sai e o novo entra.
  const mensal=useMemo(()=>{
    const hoje=new Date(now), out=[];
    for(let k=11;k>=0;k--){
      const d=new Date(hoje.getFullYear(),hoje.getMonth()-k,1);
      const ini=d.getTime();
      const fimReal=new Date(d.getFullYear(),d.getMonth()+1,1).getTime()-1;
      const fim=Math.min(fimReal,now);
      let lucro=0;
      if(fim>ini){
        const fl=entries.filter(e=>{const x=toDate(e.date).getTime();return x>=ini&&x<=fim;}).reduce((a,e)=>a+sig(e),0);
        lucro=Math.max(0,valorEm(entries,rate,fim)-valorEm(entries,rate,ini)-fl);
      }
      out.push({key:d.getFullYear()+"-"+d.getMonth(),mes:MESES[d.getMonth()],mesCurto:MES_CURTO[d.getMonth()],
        ano:d.getFullYear(),lucro,parcial:fimReal>now});
    }
    return out;
  },[entries,rate,now]);

  const melhor=useMemo(()=>mensal.reduce((a,b)=>(!a||b.lucro>a.lucro?b:a),null),[mensal]);

  const extrato=useMemo(()=>{
    const l=entries.map(e=>({id:e.id,date:e.date,desc:e.description||(e.type==="aporte"?"Aporte":"Retirada"),valor:sig(e),tipo:e.type}));
    mensalHist.forEach(m=>{ if(m.lucro>.005) l.push({id:"r-"+m.key,date:m.fimIso,desc:m.parcial?"Rendimentos (parcial)":"Rendimentos",valor:m.lucro,tipo:"rendimento"}); });
    return l.sort((a,b)=>b.date===a.date?(a.tipo==="rendimento"?-1:1):b.date.localeCompare(a.date));
  },[entries,mensalHist]);

  const posicoes=useMemo(()=>ord.map(e=>{
    const t=toDate(e.date).getTime(), c=Math.max(0,ciclos(t,now)), v=rende(sig(e),rate,c);
    const p=Math.abs(sig(e));
    const saldo=p*Math.pow(1+rate,Math.floor(c));
    return Object.assign({},e,{
      fechados:Math.floor(c),
      faltam:Math.max(0,Math.ceil((Math.floor(c)+1-c)*CICLO)),
      credito:saldo*rate,
      dias:Math.max(0,Math.floor((now-t)/MS_DAY)),
      atual:v,rendeu:v-sig(e),roi:p>0?Math.abs(v)/p-1:0});
  }).reverse(),[ord,rate,now]);

  const add=useCallback(e=>setEntries(p=>[...p,Object.assign({},e,{id:"e"+Date.now()+Math.random().toString(36).slice(2,6)})]),[]);
  const del=useCallback(id=>setEntries(p=>p.filter(x=>x.id!==id)),[]);
  const exportar=()=>{ const b=new Blob([JSON.stringify({entries,settings},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="painel-investidor-"+toIso(new Date())+".json"; a.click(); URL.revokeObjectURL(a.href); };
  const importar=f=>{ const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(Array.isArray(d.entries)) setEntries(d.entries);
      if(d.settings) setSettings(Object.assign({},INICIAL.settings,d.settings));
    }catch(e){ alert("Arquivo inválido. Escolha um backup exportado por este painel."); } };
    r.readAsText(f); };

  const ABAS=[{id:"visao",l:"Visão geral",i:"grid"},{id:"aportes",l:"Aportes",i:"wallet"},
    {id:"extrato",l:"Extrato",i:"receipt"},{id:"config",l:"Ajustes",i:"cog"}];

  return (<div className="wrap">
    {/* Cabeçalho */}
    <header style={{marginBottom:26}}>
      <div className="row wrapf" style={{justifyContent:"space-between",gap:16,alignItems:"flex-start"}}>
        <div>
          <div className="row mid" style={{gap:10,marginBottom:10}}>
            <span className="icobox" style={{width:34,height:34,borderRadius:11,background:"linear-gradient(145deg,"+POSITIVO+","+ACENTO+")",boxShadow:"0 8px 24px -10px "+ACENTO}}>
              <I n="spark" c="#fff" s={17} w={2.4}/></span>
            <div style={{height:22,width:1,background:LINE}}/>
            {nome
              ? <span style={{fontSize:15,fontWeight:700}}>Oi, {nome} 👋</span>
              : <Eyebrow>{settings.nome}</Eyebrow>}
          </div>
          <h1 style={{fontSize:36,fontWeight:800,letterSpacing:"-.03em",lineHeight:1.05,margin:0,
            background:"linear-gradient(100deg,"+TXT+" 35%,"+ACENTO+")",WebkitBackgroundClip:"text",backgroundClip:"text",color:"transparent"}}>Painel do Investidor</h1>
          <p style={{color:MUTED,fontSize:14.5,margin:"6px 0 0"}}>Acompanhamento em tempo real</p>
        </div>
        <div className="row mid" style={{gap:8}}>
          <div className="glass row mid" style={{borderRadius:999,padding:"8px 14px",gap:8}}>
            <span className="dot"/><span style={{fontSize:12.5,color:MUTED}}>Hoje</span>
            <strong className="num" style={{fontSize:13,color:POSITIVO}}>+{brl(hoje)}</strong>
          </div>
          {podeEditar
            ? <button className="btn gold" onClick={()=>setForm(true)}><I n="plus" c="#fff" s={14}/> Novo lançamento</button>
            : <span className="pill" style={{color:MUTED,background:"#F2F4F7",border:"1px solid "+LINE,padding:"9px 14px",fontWeight:700}}>Somente leitura</span>}
          {sb&&<button className="btn" onClick={()=>sb.auth.signOut()}>Sair</button>}
        </div>
      </div>
      <nav className="row scrollx" style={{marginTop:24,gap:4,borderBottom:"1px solid "+LINE,paddingBottom:1}}>
        {ABAS.map(t=>(<button key={t.id} className={"tabbtn"+(aba===t.id?" on":"")} onClick={()=>setAba(t.id)}>
          <I n={t.i} c={aba===t.id?ACENTO:MUTED} s={15}/>{t.l}</button>))}
      </nav>
    </header>

    {/* VISÃO GERAL */}
    {aba==="visao"&&(<React.Fragment>
      <div className="grid g4" style={{marginBottom:26}}>
        <Card ico="wallet" emoji="💰" rotulo="Valor investido" valor={brl(capital,0)} cor={TXT} atraso={0}
          sub={retirado>0?brl(aportado,0)+" aportados · "+brl(retirado,0)+" retirados":entries.filter(e=>e.type==="aporte").length+" aporte(s) · "+dias+" dias"}/>
        <Card ico="trend" emoji="📈" rotulo="Valorização" valor={pct(roi)} cor={POSITIVO} atraso={70}
          sub={(rate*100).toFixed(2).replace(".",",")+"% a cada 30 dias · "+Math.floor(dias/CICLO)+" ciclos fechados"}/>
        <Card ico="bank" emoji="💵" rotulo="Valor atual" valor={brl(atual)} cor={TXT} atraso={140} vivo sub={"+"+brl(porDia)+" por dia"}/>
        <Card ico="coin" emoji="💸" rotulo="Lucro acumulado" valor={brl(juros)} cor={POSITIVO} atraso={210} sub={"Próximos 30 dias: +"+brl(em30,0)}/>
      </div>

      <div className="glass rise" style={{padding:18,marginBottom:26,animationDelay:"260ms"}}>
        <div className="row mid wrapf" style={{justifyContent:"space-between",gap:8,marginBottom:12}}>
          <span className="row mid" style={{gap:8}}><I n="target" c={ACENTO} s={15}/>
            <span style={{fontSize:13.5,fontWeight:600}}>Meta de patrimônio</span>
            <span style={{color:MUTED,fontSize:12.5}}>· {brl(settings.meta,0)}</span></span>
          <span className="num" style={{fontSize:13,color:ACENTO,fontWeight:650}}>{(metaPct*100).toFixed(1).replace(".",",")}%</span>
        </div>
        <div style={{height:8,borderRadius:99,background:"rgba(255,255,255,.06)",overflow:"hidden"}}>
          <div style={{width:(metaPct*100)+"%",height:"100%",borderRadius:99,background:"linear-gradient(90deg,"+POSITIVO+","+ACENTO+")",transition:"width 1.2s cubic-bezier(.16,1,.3,1)"}}/>
        </div>
        <div style={{color:MUTED,fontSize:12.5,marginTop:9}}>
          Faltam {brl(Math.max(0,settings.meta-atual),0)} — cerca de {Math.max(0,Math.ceil(Math.log(Math.max(1,settings.meta/Math.max(1,atual)))/Math.log(1+rate)))} meses no ritmo atual.
        </div>
      </div>

      <Secao titulo="Crescimento do Patrimônio" dica="Linha cheia dourada: realizado. Pontilhado verde: projeção dos próximos 6 meses.">
        <GraficoLinha dados={linha}/>
      </Secao>

      <Secao titulo="Rendimentos Mensais" dica={"Últimos 12 meses"+(melhor&&melhor.lucro>0?" · melhor: "+melhor.mes+" com "+brl(melhor.lucro,0):"")}>
        <GraficoBarras dados={mensal}/>
        <div className="row mid" style={{gap:18,marginTop:10,paddingLeft:4,color:MUTED,fontSize:12}}>
          <span className="row mid" style={{gap:6}}><i style={{width:9,height:9,borderRadius:3,background:POSITIVO,display:"inline-block"}}/> Mês fechado</span>
          <span className="row mid" style={{gap:6}}><i style={{width:9,height:9,borderRadius:3,background:SUAVE,display:"inline-block"}}/> Mês em andamento</span>
        </div>
      </Secao>

    </React.Fragment>)}

    {/* APORTES */}
    {aba==="aportes"&&(<React.Fragment>
      <div className="grid g3" style={{marginBottom:22}}>
        <Card ico="wallet" rotulo="Capital em operação" valor={brl(capital,0)} cor={ACENTO}/>
        <Card ico="pulse" rotulo="Posições ativas" valor={String(posicoes.length)} cor={ACENTO} sub={"Desde "+(ord.length?fmtDate(ord[0].date):"—")}/>
        <Card ico="coin" rotulo="Rendendo agora" valor={"+"+brl(porDia)+"/dia"} cor={POSITIVO} vivo sub={"+"+brl(porDia/24)+" por hora"}/>
      </div>
      <Secao titulo="Seus aportes" dica="Cada lançamento com data, ciclos fechados e quando cai o próximo crédito."
        direita={podeEditar?<button className="btn gold" onClick={()=>setForm(true)}><I n="plus" c="#fff" s={14}/> Adicionar</button>:null}>
        {!posicoes.length?(
          <div style={{textAlign:"center",padding:"48px 0"}}>
            <div style={{fontSize:15,fontWeight:600}}>Nenhum lançamento ainda</div>
            <p style={{color:MUTED,fontSize:13,margin:"6px 0 16px"}}>Registre o primeiro aporte para o painel começar a calcular.</p>
            {podeEditar&&<button className="btn gold" onClick={()=>setForm(true)}><I n="plus" c="#fff" s={14}/> Adicionar aporte</button>}
          </div>
        ):(<div className="grid" style={{gap:10}}>
          {posicoes.map(p=>{const neg=p.type==="retirada";
            const andamento=Math.min(100,Math.max(0,((CICLO-p.faltam)/CICLO)*100));
            return(
            <div key={p.id} style={{border:"1px solid "+LINE,borderRadius:18,background:"#fff",padding:18}}>
              <div className="row wrapf" style={{gap:18,justifyContent:"space-between",alignItems:"center"}}>
                <div className="row mid" style={{gap:13}}>
                  <span className="icobox" style={{width:42,height:42,borderRadius:14,background:neg?"#FEF3F2":"#ECFDF3",border:"1px solid "+(neg?"#FECDCA":"#ABEFC6")}}>
                    <I n={neg?"aDown":"aUp"} c={neg?RED:ACENTO} s={19}/></span>
                  <div>
                    <div className="num" style={{fontSize:21,fontWeight:800,letterSpacing:"-.02em"}}>{brl(Math.abs(p.amount),0)}</div>
                    <div className="row mid" style={{gap:6,color:MUTED,fontSize:13.5,marginTop:2}}>
                      <I n="cal" s={13}/> {fmtDate(p.date)} · {p.dias} dias
                    </div>
                  </div>
                </div>
                <div className="grid" style={{gridTemplateColumns:"repeat(3,minmax(92px,1fr))",gap:16,flex:"1 1 300px"}}>
                  <Dado r="Valor hoje" v={brl(Math.abs(p.atual))}/>
                  <Dado r="Rendeu" v={"+"+brl(Math.abs(p.rendeu))} c={POSITIVO}/>
                  <Dado r="Rentabilidade" v={pct(p.roi)} c={POSITIVO}/>
                </div>
                {podeEditar&&<button onClick={()=>del(p.id)} title="Excluir lançamento"
                  style={{background:"none",border:"none",cursor:"pointer",padding:8}}><I n="trash" s={16}/></button>}
              </div>
              <div className="row mid wrapf" style={{gap:10,marginTop:16,justifyContent:"space-between",fontSize:13}}>
                <span style={{color:MUTED,fontWeight:600}}>{p.fechados} ciclo(s) de 30 dias já creditado(s)</span>
                <span style={{color:ACENTO,fontWeight:700}}>Próximo crédito em {p.faltam} dia(s): +{brl(p.credito,0)}</span>
              </div>
              <div style={{marginTop:8,height:5,borderRadius:99,background:"#F2F4F7",overflow:"hidden"}}>
                <div style={{width:andamento+"%",height:"100%",background:"linear-gradient(90deg,"+POSITIVO+","+ACENTO+")",transition:"width 1s ease"}}/>
              </div>
            </div>);})}
        </div>)}
      </Secao>
    </React.Fragment>)}

    {/* EXTRATO */}
    {aba==="extrato"&&(
      <Secao titulo="Extrato completo" dica="Lançamentos e rendimentos apurados mês a mês."
        direita={<button className="btn" onClick={exportar}><I n="down" s={14}/> Exportar</button>}>
        <Tabela linhas={extrato} aoExcluir={podeEditar?del:null}/>
      </Secao>)}

    {/* AJUSTES */}
    {aba==="config"&&(<React.Fragment>
      <Secao titulo="Parâmetros" dica="Qualquer mudança recalcula o painel inteiro na hora.">
        <div className="grid g3">
          <Campo rotulo="Taxa mensal (%)"><input disabled={!podeEditar} type="number" step="0.1" value={(settings.rate*100).toFixed(2)}
            onChange={e=>setSettings(s=>Object.assign({},s,{rate:Math.max(0,Number(e.target.value)/100)}))}/></Campo>
          <Campo rotulo="Meta de patrimônio (R$)"><input disabled={!podeEditar} type="number" step="1000" value={settings.meta}
            onChange={e=>setSettings(s=>Object.assign({},s,{meta:Number(e.target.value)}))}/></Campo>
          <Campo rotulo="Nome da carteira"><input disabled={!podeEditar} type="text" value={settings.nome}
            onChange={e=>setSettings(s=>Object.assign({},s,{nome:e.target.value}))}/></Campo>
        </div>
        <p style={{color:MUTED,fontSize:12.5,marginTop:16,lineHeight:1.6}}>
          A taxa incide a cada 30 dias sobre o saldo do ciclo anterior: R$ 3.000 viram R$ 3.300 no dia 30 e R$ 3.630 no dia 60.
          Dentro do ciclo em andamento o painel mostra o rendimento proporcional aos dias já corridos, sem juros sobre juros diários.
          Cada aporte tem o seu próprio ciclo, contado a partir da data em que foi lançado. {sb?"Os dados estão sincronizados com o Supabase.":"Os dados estão salvos neste navegador."}
        </p>
      </Secao>
      <Secao titulo="Backup dos dados" dica="Baixe um arquivo com tudo, ou restaure de um backup anterior.">
        <div className="row wrapf" style={{gap:10}}>
          <button className="btn" onClick={exportar}><I n="down" s={14}/> Exportar JSON</button>
          {podeEditar&&<label className="btn" style={{margin:0}}>
            <input type="file" accept="application/json" style={{display:"none"}} onChange={e=>e.target.files[0]&&importar(e.target.files[0])}/>
            <I n="up" s={14}/> Importar JSON
          </label>}
          {podeEditar&&<button className="btn danger" onClick={()=>{if(confirm("Apagar todos os lançamentos?")) setEntries([]);}}><I n="trash" c={RED} s={14}/> Limpar lançamentos</button>}
        </div>
      </Secao>
    </React.Fragment>)}

    <footer className="row mid wrapf" style={{marginTop:36,paddingTop:20,borderTop:"1px solid "+LINE,color:MUTED,fontSize:12,justifyContent:"space-between",gap:10}}>
      <span>{settings.nome} · taxa de {(rate*100).toFixed(2).replace(".",",")}% ao mês</span>
      <span>Atualizado às {new Date(now).toLocaleTimeString("pt-BR")}</span>
    </footer>

    {form&&<Formulario fechar={()=>setForm(false)} salvar={e=>{add(e);setForm(false);}}/>}
  </div>);
}

function Col({r,v,sub,c=TXT}){
  return (<div style={{textAlign:"right"}}>
    <div style={{color:MUTED,fontSize:10.5,letterSpacing:".1em",textTransform:"uppercase",fontWeight:600}}>{r}</div>
    <div className="num" style={{color:c,fontSize:14.5,fontWeight:650,marginTop:2}}>{v}</div>
    {sub&&<div style={{color:POSITIVO,fontSize:11.5}}>{sub}</div>}
  </div>);
}

function App(){
  const [sessao,setSessao]=useState(sb?undefined:null);
  useEffect(()=>{
    if(!sb) return;
    sb.auth.getSession().then(r=>setSessao(r.data.session||null));
    const r=sb.auth.onAuthStateChange((_e,ses)=>setSessao(ses||null));
    return()=>{ try{ r.data.subscription.unsubscribe(); }catch(e){} };
  },[]);
  if(sessao===undefined) return <div style={{minHeight:"100vh",display:"grid",placeItems:"center",color:MUTED,fontSize:14}}>Carregando…</div>;
  if(sb&&!sessao) return <TelaLogin/>;
  return <Painel sessao={sessao}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
document.getElementById("boot").style.display="none";
</script>
</body>
</html>
